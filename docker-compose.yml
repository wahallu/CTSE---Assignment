version: '3.8'

services:

  event-service:
    build:
      context: ./eventservice
      dockerfile: Dockerfile
    container_name: event-service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb+srv://nisal:1234@cluster0.p860x.mongodb.net/eventdb
    networks:
      - event-network

  ticket-service:
    build:
      context: ./ticketservice
      dockerfile: Dockerfile
    container_name: ticket-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb+srv://nisal:1234@cluster0.p860x.mongodb.net/ticketdb
    networks:
      - event-network

  user-service:
    build:
      context: ./userservice
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb+srv://nisal:1234@cluster0.p860x.mongodb.net/userdb
    networks:
      - event-network

  payment-service:
    build:
      context: ./paymentservice
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "6000:6000"
    environment:
      - PORT=6000
      - MONGODB_URI=mongodb+srv://nisal:1234@cluster0.p860x.mongodb.net/paymentdb
    networks:
      - event-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - event-network

networks:
  event-network:
    driver: bridge
